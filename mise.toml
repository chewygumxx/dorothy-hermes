# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json

#
#
# ~chewygumxx/dorothy-hermes.git
# ::: :/mise.toml
#
#

#
# https://mise.jdx.dev/configuration.html
#
# The development toolchain for this repository, in one place.
#
# Everything the repository runs that Bun does not install lives here, so
# a checkout never depends on whatever the contributor happens to have on
# `PATH`. Packages (commitlint, Biome, remark, prettier, husky, TypeScript)
# are pinned in `package.json` and installed by Bun instead; together the
# two files are the whole dependency surface. CI installs from this file via
# `jdx/mise-action`, so the versions below are the ones CI runs.
#
# Backends are named explicitly rather than relying on the registry alias,
# so the resolution is visible here and cannot change underneath the pin.
#

min_version = "2026.9.0"

[tools]
#
# Runtimes
#
bun  = "1.4"
# Node runs our TypeScript in the image; tests run on the same version.
node = "26.5.1"

#
# Utilities
#
# `jq` parses the tool payload in `.claude/hooks/guard-secrets.sh`.
#
"aqua:jqlang/jq"       = "1"
# `dotenvx` decrypts `.env` for `mise run up`.
"aqua:dotenvx/dotenvx" = "1"

#
# YAML
#
# yamllint is a Python tool, installed with the uv pinned beside it. Its
# rules come from `.yamllint.yaml`, which extends `@chewygumxx/yamllint-config`
# in `package.json`; prettier, which formats YAML, is a package pinned
# there too.
#
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"

#
# TOML
#
# tombi formats and lints every TOML file by `.tombi.toml`, validating each
# against the schema its `#:schema` line names.
#
"aqua:tombi-toml/tombi" = "1.5.5"

#
# Shell
#
# shfmt and shellcheck, the pair CI's lint-shell runs. Pinned here so
# `bun run check` and the shell-lint plugin's hook find them; an unpinned
# shim fails, and that hook then skips every file without a word.
#
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.14.1"

[tasks.test]
description = "Unit tests under the image's Node"
run         = "node --test --test-reporter=spec 'hermes/src/**/*.test.ts' 'scripts/**/*.test.ts'"

[tasks.smoke]
description = "Boot the stack against fixture repositories"
run         = "sh smoke/run.sh"

[tasks.up]
description = "Start Dorothy"
run         = "DOROTHY_HOST=$(hostname) dotenvx run -- docker compose up -d --wait --wait-timeout 600"

[tasks.act]
#
# Runs CI locally in Docker; see the `chewygumxx/.github` README.
#
description = "Run CI locally with act"
file        = "git::https://github.com/chewygumxx/.github.git//tasks/act?ref=v1"

[settings]
#
# Refetch remote tasks each time one runs, so `act` follows `v1` as it
# moves; mise otherwise keeps its first copy for good.
#
task.remote_no_cache = true
