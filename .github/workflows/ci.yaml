#
#
# ~chewygumxx/dorothy-hermes.git
# ::: :/.github/workflows/ci.yaml
#
#

# The shared standard checks (commitlint, header sync, generic lint and
# format, metadata sync), then this repository's own `bun run check` against
# the commit the header sync pushed. See chewygumxx/.github for each part.
#
# workflow_dispatch re-runs the metadata sync once the METADATA_APP_* secret
# and variable are corrected.

name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: write
    pull-requests: read

# Not cancelled in progress: a newer run must not interrupt the header sync
# part-way through its commit.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    standard:
        uses: chewygumxx/.github/.github/workflows/standard.yaml@6a93bf782466c25b173b05d92d8b5b10dc356441 # v1
        with:
            metadata-client-id: ${{ vars.METADATA_APP_CLIENT_ID }}
            # `bun run check` lints YAML with the repository's .yamllint.yaml,
            # which needs node_modules that lint-format does not install.
            yaml: false
        secrets:
            metadata-private-key: ${{ secrets.METADATA_APP_PRIVATE_KEY }}

    check:
        needs: standard
        if: ${{ !cancelled() }}
        permissions:
            contents: read
        uses: chewygumxx/.github/.github/workflows/lint.yaml@6a93bf782466c25b173b05d92d8b5b10dc356441 # v1
        with:
            ref: ${{ needs.standard.outputs.sha }}

    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Toolchain
              uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

            - name: Unit Tests
              run: mise run test

    smoke:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Toolchain
              uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

            - name: Smoke Test
              run: mise run smoke
